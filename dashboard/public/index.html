<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console dev · Infra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Console&nbsp;dev</span>
    </div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Filtrer projets, containers, sessions, worktrees…"
             aria-label="Filtrer">
    </div>
    <div class="status" id="status">
      <span class="dot" id="status-dot" aria-hidden="true"></span>
      <span id="status-text">connexion…</span>
      <a class="export" id="export" href="/api/metrics.csv" download>Exporter CSV</a>
    </div>
  </header>

  <main>
    <!-- Vitals: le coup d'œil santé -->
    <section id="system" class="vitals" aria-label="Ressources système">
      <div class="vital" data-k="ram">   <span class="vital-h">Mémoire</span><div class="meter"><span></span></div><span class="vital-v">—</span></div>
      <div class="vital" data-k="swap">  <span class="vital-h">Swap</span>   <div class="meter"><span></span></div><span class="vital-v">—</span></div>
      <div class="vital" data-k="cpu">   <span class="vital-h">CPU · charge</span><div class="meter"><span></span></div><span class="vital-v">—</span></div>
      <div class="vital" data-k="disk">  <span class="vital-h">Disque /</span><div class="meter"><span></span></div><span class="vital-v">—</span></div>
    </section>

    <div class="grid">
      <section id="docker" class="panel">
        <div class="panel-h"><h2>Docker</h2><span class="count" data-count>—</span></div>
        <div class="groups" data-groups></div>
        <p class="empty" data-empty hidden>Aucun container en cours.</p>
      </section>

      <section id="sessions" class="panel">
        <div class="panel-h"><h2>Sessions Claude</h2><span class="count" data-count>—</span></div>
        <div class="groups" data-groups></div>
        <p class="empty" data-empty hidden>Aucune session active.</p>
      </section>

      <section id="worktrees" class="panel">
        <div class="panel-h"><h2>Worktrees</h2><span class="count" data-count>—</span></div>
        <div class="rows" data-rows></div>
        <p class="empty" data-empty hidden>Aucun worktree-env. Demande « nouveau worktree &lt;ticket&gt; ».</p>
      </section>

      <section id="disk" class="panel">
        <div class="panel-h"><h2>Disque</h2><span class="count" data-count>—</span></div>
        <div class="rows" data-rows></div>
        <p class="empty" data-empty hidden>—</p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
