<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worktree.docker.test — tableau de bord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Tableau de bord</h1>
  <div class="topbar-actions">
    <span id="last-update" class="muted">—</span>
    <a id="export-csv" class="btn" href="/api/metrics.csv" download>Export CSV</a>
  </div>
</header>

<main>
  <section id="system" class="card">
    <h2>Système</h2>
    <div class="gauges" id="system-gauges"></div>
  </section>

  <section id="docker" class="card">
    <h2>Docker</h2>
    <div class="table-wrap"><table id="docker-table">
      <thead><tr><th>Nom</th><th>Projet</th><th>CPU %</th><th>Mémoire</th><th>Mém %</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section id="worktrees" class="card">
    <h2>Worktrees</h2>
    <div class="table-wrap"><table id="worktrees-table">
      <thead><tr><th>Projet</th><th>Branche</th><th>Domaine</th><th>Disque</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section id="sessions" class="card">
    <h2>Sessions Claude</h2>
    <div class="table-wrap"><table id="sessions-table">
      <thead><tr><th>PID</th><th>Type</th><th>Modèle</th><th>RSS</th><th>CPU %</th><th>Âge</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section id="disk" class="card">
    <h2>Disque</h2>
    <div class="table-wrap"><table id="disk-table">
      <thead><tr><th>Point de montage</th><th>Taille</th><th>Utilisé</th><th>Disponible</th><th>Utilisation</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
