# Socle d'hébergement partagé : un reverse proxy, une base par moteur, un capteur de mails,
# une console SQL. Les applications ne déclarent que leurs propres services et rejoignent
# les réseaux externes `traefik`, `databases`, `mailer` (voir docs/CONTRACT.md).
#
# Un seul fichier pour tous les hôtes : ce qui varie est dans `.env` (ENV, domaines, secrets)
# et dans configuration/traefik2/config/{traefik.<ENV>.yaml,dynamic/<ENV>/}.

services:
  reverse-proxy:
    # v3.7 : branche supportée (la 2.11 n'a plus de correctifs depuis le 2026-09-07).
    image: traefik:v3.7
    container_name: infra_traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.51
    command:
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --api.dashboard=true
      - --api.insecure=${TRAEFIK_DASHBOARD_INSECURE}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monitoring.tls=true"
      - "traefik.http.routers.monitoring.rule=Host(`${MONITORING_DOMAIN}`)"
      - "traefik.http.routers.monitoring.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.monitoring.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.monitoring.service=api@internal"
      - "traefik.http.routers.monitoring.middlewares=${TRAEFIK_MONITORING_MIDDLEWARE}"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}"
    ports:
      # TRAEFIK_BIND vide = toutes les interfaces ; "127.0.0.1:" ou "<ip>:" pour restreindre.
      - "${TRAEFIK_BIND}80:80"
      - "${TRAEFIK_BIND}443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./configuration/traefik2/config/traefik.${ENV}.yaml:/etc/traefik/traefik.yaml:ro
      # Config dynamique : on monte le DOSSIER, jamais un fichier. Un bind mount de fichier
      # est résolu une fois pour toutes à la création du conteneur ; `git pull` écrit un
      # temporaire puis le renomme (nouvel inode) et le conteneur continue de lire l'ancien
      # contenu : les middlewares disparaissent, les routeurs qui les référencent sont
      # supprimés, tous les sites tombent en 404. Le dossier rend le rechargement à chaud réel.
      - ./configuration/traefik2/config/dynamic/${ENV}:/etc/traefik/dynamic:ro
      - ./configuration/traefik2/logs/:/logs/
      - ./configuration/traefik2/certs:/etc/certs:ro
    networks:
      - traefik

  mysql:
    # 8.4 = branche LTS (correctifs seulement). Passage de série = mise à niveau EN PLACE du
    # dictionnaire de données, SANS retour arrière en place : dump logique d'abord, procédure dans
    # docs/RUNBOOK-deploy.md §4 ; `make check` refuse le changement de série non confirmé.
    # Le nom du conteneur et les chemins `mysql_8_0` restent : les applications les référencent
    # (contrat, docs/CONTRACT.md). Ils ne désignent plus la version.
    image: mysql:8.4
    container_name: infra_mysql_8_0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./datas/mysql_8_0/datas:/var/lib/mysql
      - ./datas/mysql_8_0/files:/var/lib/mysql-files
      - ./configuration/mysql_8_0/conf.d:/etc/mysql/conf.d:ro
    networks:
      - databases

  # Second moteur, pour les applications dont la production tourne en MariaDB : la parité de
  # moteur compte (Doctrine, collations, JSON). Démarré seulement avec `--profile mariadb`
  # (make up PROFILES=mariadb) : il n'a pas vocation à exister sur tous les hôtes.
  mariadb:
    image: mariadb:11.3.2
    container_name: infra_mariadb_11_3
    restart: always
    profiles: [mariadb]
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./datas/mariadb_11_3/datas:/var/lib/mysql
    networks:
      - databases

  phpmyadmin:
    # Image officielle Docker (library), reconstruite à chaque correctif PHP. phpmyadmin/phpmyadmin n'est
    # plus mise à jour (PHP 8.3.26 au 2026-10-22, vulnérable à PHP2Shell). Branche figée, correctifs suivis.
    image: phpmyadmin:5.2
    container_name: infra_phpmyadmin
    restart: always
    environment:
      # Les deux moteurs sont proposés ; l'entrée MariaDB n'est joignable que si le profil tourne.
      - PMA_HOSTS=infra_mysql_8_0,infra_mariadb_11_3
      - PMA_VERBOSES=MySQL 8.4,MariaDB 11.3.2
      - UPLOAD_LIMIT=${PMA_UPLOAD_LIMIT:-512M}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`${PMA_DOMAIN}`)"
      - "traefik.http.routers.phpmyadmin.tls=true"
      - "traefik.http.routers.phpmyadmin.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.phpmyadmin.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
      # Identifiants PROPRES à phpMyAdmin : il ouvre toutes les bases de l'hôte, il ne
      # partage pas le mot de passe du tableau de bord. Variable vide = middleware invalide =
      # routeur supprimé = 404 : un outil d'administration échoue fermé, jamais ouvert.
      # Corollaire : TRAEFIK_PHPMYADMIN_USERS doit être posée AVANT le déploiement (make check).
      - "traefik.http.routers.phpmyadmin.middlewares=phpmyadmin-auth"
      - "traefik.http.middlewares.phpmyadmin-auth.basicauth.users=${TRAEFIK_PHPMYADMIN_USERS}"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - databases

  mailer:
    image: axllent/mailpit
    container_name: infra_mailer
    restart: always
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`${MAILPIT_DOMAIN}`)"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.routers.mailpit.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.mailpit.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "traefik.http.routers.mailpit.middlewares=${TRAEFIK_MAILPIT_MIDDLEWARE}"
      - "traefik.http.middlewares.mailpit-auth.basicauth.users=${TRAEFIK_MAILPIT_USERS}"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - mailer

  # Surveillance externe (disponibilité, codes HTTP, expiration TLS) avec alertes Telegram.
  # Profil optionnel `gatus` : COMPOSE_PROFILES=gatus dans .env (ou make up PROFILES=gatus).
  # La liste de ce que l'hôte surveille n'est PAS dans ce dépôt : elle est fournie par l'hôte, dans
  # le dossier GATUS_CONFIG_DIR (chemin absolu hors du checkout). configuration/gatus/example/ en
  # donne la forme. Service nommé `gatus`, pas `monitoring` : ce nom désigne déjà le routeur du
  # tableau de bord Traefik et MONITORING_DOMAIN.
  gatus:
    image: twinproduction/gatus:v5.37.0
    container_name: infra_gatus
    restart: always
    profiles: [gatus]
    environment:
      # Un DOSSIER, comme la config dynamique de Traefik : un bind mount de fichier garde l'ancien
      # inode quand le fichier est remplacé, et Gatus ne verrait jamais la nouvelle liste.
      - GATUS_CONFIG_PATH=/config
      # Seules variables passées au conteneur : la config ne peut référencer qu'elles (make check).
      - GATUS_TELEGRAM_TOKEN=${GATUS_TELEGRAM_TOKEN:-}
      - GATUS_TELEGRAM_CHAT_ID=${GATUS_TELEGRAM_CHAT_ID:-}
    volumes:
      # Valeur par défaut volontairement inexistante : sans GATUS_CONFIG_DIR, Gatus ne trouve aucune
      # config et s'arrête (make check le refuse avant). Jamais de repli silencieux sur l'exemple.
      - ${GATUS_CONFIG_DIR:-./configuration/gatus/unset}:/config:ro
      - ./datas/gatus:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`${GATUS_DOMAIN:-}`)"
      - "traefik.http.routers.gatus.tls=true"
      - "traefik.http.routers.gatus.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.gatus.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"
      # Même règle que phpMyAdmin : identifiants propres, variable vide = middleware invalide =
      # routeur supprimé = 404. La page liste tous les domaines surveillés : jamais ouverte.
      - "traefik.http.routers.gatus.middlewares=gatus-auth"
      - "traefik.http.middlewares.gatus-auth.basicauth.users=${TRAEFIK_GATUS_USERS:-}"
      - "traefik.docker.network=traefik"
    networks:
      - traefik

# Réseaux créés une fois par hôte (make networks) : ils survivent au `down` du socle et sont
# rejoints par les applications en `external: true`.
networks:
  traefik:
    external: true
  databases:
    external: true
  mailer:
    external: true
