global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    watch: true
    exposedbydefault: false

  file:
    filename: /etc/traefik/dynamic_conf.yaml
    watch: true

log:
  level: DEBUG
  format: common

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ':443'

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Access log: real client IP behind Cloudflare (Cf-Connecting-Ip) + Referer + User-Agent, for traffic-source tracing.
# Rotated by configuration/traefik2/rotate-logs.sh (cron); Traefik reopens the file on SIGUSR1.
accessLog:
  filePath: /logs/access.log
  format: json
  bufferingSize: 0
  fields:
    headers:
      names:
        Referer: keep
        User-Agent: keep
        Cf-Connecting-Ip: keep
        X-Forwarded-For: keep
