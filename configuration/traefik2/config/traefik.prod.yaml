global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    watch: true
    exposedbydefault: false

  file:
    # Dossier et non fichier : cf. le commentaire du volume dans compose.yml.
    # Tout *.yaml depose dans configuration/traefik2/config/dynamic/prod/ est
    # charge et recharge a chaud.
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: common

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ':443'

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Access log: real client IP when a CDN sits in front (Cf-Connecting-Ip, X-Forwarded-For) + Referer + User-Agent, for traffic-source tracing.
# Rotated by configuration/traefik2/rotate-logs.sh (cron); Traefik reopens the file on SIGUSR1.
accessLog:
  filePath: /logs/access.log
  format: json
  bufferingSize: 0
  fields:
    headers:
      names:
        Referer: keep
        User-Agent: keep
        Cf-Connecting-Ip: keep
        X-Forwarded-For: keep
