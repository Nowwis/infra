global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    watch: true
    exposedbydefault: false

  file:
    # Dossier et non fichier : cf. le commentaire du volume dans compose.yml.
    # Tout *.yaml depose dans configuration/traefik2/config/dynamic/local/ est
    # charge et recharge a chaud.
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: common

entryPoints:
  web:
    address: ':80'
    http:
      # v3 : supprime les en-têtes qui en imitent un autre (X_Forwarded_For, X.Auth.User…). PHP, nginx
      # et CGI les lisent comme l'en-tête imité : sans cela un client usurpe ceux que Traefik pose.
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ':443'
    http:
      aliasHeadersStrategy: delete
