tls:
  certificates:
    - certFile: /etc/certs/docker.localhost.pem
      keyFile: /etc/certs/docker.localhost-key.pem

# console dev — route de la console d'observabilité (console.docker.test).
# Les services (php -S web + collecteur) sont fournis hors compose par bin/console-install
# (systemd --user), atteints via l'IP Tailscale de l'hôte. Le secret basic-auth n'est PAS
# ici : il est dans un fichier htpasswd gitignored (certs/console.htpasswd, monté /etc/certs).
http:
  routers:
    console:
      rule: "Host(`console.docker.test`)"
      entrypoints: [websecure]
      service: console
      middlewares: [console-auth]
      tls: {}
    nowia-app:
      rule: "Host(`nowia.docker.test`)"
      entrypoints: [websecure]
      service: nowia-app
      tls: {}
  services:
    console:
      loadBalancer:
        servers:
          - url: "http://100.75.44.109:8899"
    nowia-app:
      loadBalancer:
        servers:
          - url: "http://100.75.44.109:8811"
  middlewares:
    console-auth:
      basicAuth:
        usersFile: "/etc/certs/console.htpasswd"
    # Défini mais non référencé par le routeur nowia-app : NOWIA est aujourd'hui
    # accessible sans authentification à qui est sur Tailscale.
    nowia-app-auth:
      basicAuth:
        usersFile: "/etc/certs/console.htpasswd"
