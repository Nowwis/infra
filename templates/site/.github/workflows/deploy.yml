name: Deploy

on:
    push:
        branches: [main, develop]
        paths-ignore: ['docs/**', '**.md']
    workflow_dispatch:

# Déploiement par git, sur un runner self-hosted installé SUR le serveur cible : connexion
# locale, pas de SSH ni de rsync, minutes GitHub gratuites.
#   push main    → environnement GitHub « prod »
#   push develop → environnement GitHub « preprod »
# Rien de propre à un serveur dans ce fichier. Chaque environnement GitHub définit :
#   vars.VPS_DEPLOY_DIR  répertoire du site sur le serveur (clone git, avec son .docker/.env)
#   vars.SITE_URL        URL publique testée après déploiement
# Prérequis serveur : runner en ligne avec les labels « self-hosted » et « prod » (ou
# « preprod »), utilisateur non root membre du groupe docker, make et docker compose.

jobs:
    deploy:
        runs-on:
            - self-hosted
            - ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}
        environment: ${{ github.ref_name == 'main' && 'prod' || 'preprod' }}
        permissions:
            actions: read
            contents: read

        steps:
            # Prod et preprod peuvent partager un serveur : on sérialise les déploiements.
            - name: Attendre la fin des déploiements précédents
              uses: ahmadnassri/action-workflow-queue@v1
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  timeout: 1800000

            - name: Mettre à jour le code et redéployer
              env:
                  DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR }}
                  DEPLOY_REF: ${{ github.ref_name }}
              run: |
                  test -n "$DEPLOY_DIR" || { echo "vars.VPS_DEPLOY_DIR absente pour cet environnement"; exit 1; }
                  cd "$DEPLOY_DIR"
                  git fetch origin
                  git checkout "$DEPLOY_REF"
                  git reset --hard "origin/$DEPLOY_REF"
                  make ENV=prod deploy

            - name: Test du site servi
              env:
                  SITE_URL: ${{ vars.SITE_URL }}
              run: |
                  test -n "$SITE_URL" || { echo "vars.SITE_URL absente : test ignoré"; exit 0; }
                  for i in $(seq 1 12); do
                    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL") || code=000
                    case "$code" in 2*|3*) echo "$SITE_URL → $code"; exit 0 ;; esac
                    sleep 5
                  done
                  echo "$SITE_URL ne répond pas correctement (dernier code : $code)"; exit 1
