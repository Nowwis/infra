user nginx;
worker_processes auto;
daemon off;

pid        /var/run/nginx.pid;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # TLS terminé par Traefik : PHP doit savoir que la requête d'origine était en HTTPS
    # (sinon redirections vers http://, contenu mixte, boucles de redirection).
    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https on;
    }

    server {
        listen 80 default_server;

        root /var/www/public;
        index index.php index.html index.htm;

        # Maintenance : var/maintenance.flag présent (posé par une cible du projet, ex. maintenance-on)
        # → 503 sur tout le site, avec public/maintenance.html s'il existe (page autonome : CSS et
        # images en ligne, les autres fichiers répondent 503 aussi), sinon la page 503 de nginx.
        error_page 503 @maintenance;
        if (-f /var/www/var/maintenance.flag) {
            return 503;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Fichiers et dossiers cachés (.git, .env, .docker…) refusés, sauf /.well-known/.
        # Premier bloc regex du serveur : nginx retient le premier qui correspond, un bloc
        # d'extension placé avant (.json, .txt…) servirait sinon un fichier caché.
        location ~ /\.(?!well-known/) {
            deny all;
        }

        # Règles propres au projet (fichiers montés par .docker/docker-compose[.prod].project.yml dans
        # /etc/nginx/project.d/, niveau server : location, client_max_body_size…). Placées avant les
        # autres blocs regex : une location regex du projet passe avant celles du modèle. Vide = sans effet.
        include /etc/nginx/project.d/*.conf;

        # Seul le contrôleur frontal s'exécute ; tout autre .php répond 404 (un .php déposé dans
        # public/uploads n'est jamais exécuté).
        location ~ ^/index\.php(/|$) {
            fastcgi_pass php:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 600;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $fastcgi_https;
        }

        location ~ \.php$ {
            return 404;
        }

        location @maintenance {
            add_header Retry-After 300 always;
            add_header Cache-Control "no-store" always;
            # Le fichier est servi dans cette location nommée (pas de nouvelle requête, donc pas de
            # boucle) ; absent → 503 de nginx (recursive_error_pages off).
            try_files /maintenance.html =503;
        }
    }
}
