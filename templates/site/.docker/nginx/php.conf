user nginx;
worker_processes auto;
daemon off;

pid        /var/run/nginx.pid;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    sendfile        on;
    keepalive_timeout  65;
    # Au niveau http : un fichier du projet dans project.d peut le redéfinir pour le serveur.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # TLS terminé par Traefik : PHP doit savoir que la requête d'origine était en HTTPS
    # (sinon redirections vers http://, contenu mixte, boucles de redirection).
    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https on;
    }

    # PHP natif, sans framework : la racine web est la racine du projet.
    server {
        listen 80 default_server;

        root /var/www;
        index index.php index.html;
        charset UTF-8;

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Fichiers et dossiers cachés (.git, .env, .docker…) refusés, sauf /.well-known/.
        # Premier bloc regex du serveur : nginx retient le premier qui correspond, un bloc
        # d'extension placé avant (.json, .txt…) servirait sinon un fichier caché.
        location ~ /\.(?!well-known/) {
            deny all;
        }

        # Règles propres au projet (fichiers montés par .docker/docker-compose[.prod].project.yml dans
        # /etc/nginx/project.d/, niveau server : location, client_max_body_size…). Placées avant les
        # autres blocs regex : une location regex du projet passe avant celles du modèle. Vide = sans effet.
        include /etc/nginx/project.d/*.conf;

        # Racine web = racine du dépôt : fichiers d'outillage refusés (déploiement, make, composer et
        # dépendances, documentation à la racine ; .docker/ l'est déjà comme chemin caché).
        # Correspondances exactes et préfixes ^~ : prioritaires sur tout bloc regex, quel que soit l'ordre.
        location ^~ /deploy/ {
            deny all;
        }
        location ^~ /vendor/ {
            deny all;
        }
        location = /Makefile {
            deny all;
        }
        location = /composer.json {
            deny all;
        }
        location = /composer.lock {
            deny all;
        }
        # Documentation à la racine (README.md, CHANGELOG.md…) ; seul bloc regex de cette liste,
        # placé après les règles du projet.
        location ~* ^/[^/]+\.md$ {
            deny all;
        }

        # Un .php déposé dans un dossier d'envoi n'est jamais exécuté.
        location ~* /(?:uploads|files)/.*\.php$ {
            deny all;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 600;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $fastcgi_https;
        }

        location ~* \.(css|js|mjs|woff2?|ttf|otf|eot)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|pdf)$ {
            expires 30d;
            add_header Cache-Control "public";
            log_not_found off;
        }
    }
}
