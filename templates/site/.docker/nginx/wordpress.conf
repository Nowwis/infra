user nginx;
worker_processes auto;
daemon off;

pid        /var/run/nginx.pid;

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    sendfile        on;
    keepalive_timeout  65;
    # Au niveau http (et non dans la location PHP) : un fichier du projet dans project.d peut le
    # redéfinir pour tout le serveur. À accorder avec post_max_size / upload_max_filesize de PHP.
    client_max_body_size 20M;

    # TLS terminé par Traefik : PHP doit savoir que la requête d'origine était en HTTPS
    # (sinon redirections vers http://, contenu mixte, boucles de redirection).
    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https on;
    }

    server {
        listen 80 default_server;

        root /var/www;
        index index.php;
        charset UTF-8;

        ##
        # gzip config
        ##

        gzip on;
        gzip_static on;
        gzip_vary on;
        gzip_disable "msie6";
        gzip_types text/css text/x-component application/x-javascript application/javascript text/javascript text/x-js text/richtext image/svg+xml text/plain text/xsd text/xsl text/xml image/x-icon;
        gzip_http_version 1.1;
        gzip_comp_level 6;
        gzip_proxied any;

        # Fichiers et dossiers cachés (.git, .env, .docker…) refusés, sauf /.well-known/.
        # Premier bloc regex du serveur : nginx retient le premier qui correspond, un bloc
        # d'extension placé avant (.json, .txt…) servirait sinon un fichier caché.
        location ~ /\.(?!well-known/) {
            deny all;
        }

        # Règles propres au projet (fichiers montés par .docker/docker-compose[.prod].project.yml dans
        # /etc/nginx/project.d/, niveau server : location, client_max_body_size…). Placées avant les
        # autres blocs regex : une location regex du projet passe avant celles du modèle. Vide = sans effet.
        include /etc/nginx/project.d/*.conf;

        # Racine web = racine du dépôt : fichiers d'outillage refusés (déploiement, make, composer,
        # documentation à la racine ; .docker/ l'est déjà comme chemin caché). Correspondances
        # exactes et préfixes ^~ : prioritaires sur tout bloc regex, quel que soit l'ordre.
        location ^~ /deploy/ {
            deny all;
        }
        location = /Makefile {
            deny all;
        }
        location = /composer.json {
            deny all;
        }
        location = /composer.lock {
            deny all;
        }
        location = /readme.html {
            deny all;
        }
        location = /license.txt {
            deny all;
        }
        location = /wp-config-sample.php {
            deny all;
        }
        # Documentation à la racine (README.md, CHANGELOG.md…) ; seul bloc regex de cette liste,
        # placé après les règles du projet.
        location ~* ^/[^/]+\.md$ {
            deny all;
        }

        ##
        # Browser cache config
        ##

        location ~ \.(css|htc|js|js2|js3|js4)$ {
            expires max;
            add_header Pragma "public";
            add_header Cache-Control "max-age=31536000, public, must-revalidate, proxy-revalidate";
        }

        location ~ \.(html|htm|rtf|rtx|svg|svgz|txt|xsd|xsl|xml)$ {
            # wp-sitemap.xml, robots.txt virtuel, flux… sont générés par WordPress : sans ce repli
            # sur index.php, ils répondent 404.
            try_files $uri /index.php?$args;
            expires 3600s;
            add_header Pragma "public";
            add_header Cache-Control "max-age=3600, public, must-revalidate, proxy-revalidate";
        }

        location ~ \.(asf|asx|wax|wmv|wmx|avi|bmp|class|divx|doc|docx|eot|exe|gif|gz|gzip|ico|jpg|jpeg|jpe|json|mdb|mid|midi|mov|qt|mp3|m4a|mp4|m4v|mpeg|mpg|mpe|mpp|otf|odb|odc|odf|odg|odp|ods|odt|ogg|pdf|png|pot|pps|ppt|pptx|ra|ram|svg|svgz|swf|tar|tif|tiff|ttf|ttc|wav|wma|wri|xla|xls|xlsx|xlt|xlw|zip)$ {
            expires max;
            add_header Pragma "public";
            add_header Cache-Control "max-age=31536000, public, must-revalidate, proxy-revalidate";
            log_not_found off;
        }

        ##
        # Favicon
        ##

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        ##
        # robots.txt
        ##

        location = /robots.txt {
            # Sans fichier physique, WordPress génère le robots.txt (avec le sitemap).
            try_files $uri /index.php?$args;
            allow all;
            log_not_found off;
            access_log off;
        }

        ##
        # Deny access to uploaded PHP files
        ##

        location ~* /(?:uploads|files)/.*\.php$ {
            deny all;
        }

        ##
        # Deny access to WordPress include-only files
        ##

        location = /wp-config.php {
            deny all;
        }
        location ~ ^/wp-admin/includes/ {
            deny all;
        }
        location ~ ^/wp-includes/[^/]+\.php$ {
            deny all;
        }
        location ~ ^/wp-includes/js/tinymce/langs/.+\.php {
            deny all;
        }
        location ~ ^/wp-includes/theme-compat/ {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?q=$uri&$args;
        }

        location ~ \.php$ {
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_index index.php;
            fastcgi_pass  php:9000;
        }
    }
}
