user nginx;
worker_processes auto;
daemon off;
pid /var/run/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Site statique : pas de PHP, la racine publique est public/.
    server {
        listen 80 default_server;
        root /var/www/public;
        index index.html;
        charset UTF-8;

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Fichiers et dossiers cachés (.git, .env, .docker…) refusés, sauf /.well-known/.
        # Premier bloc regex du serveur : nginx retient le premier qui correspond, un bloc
        # d'extension placé avant (.json, .txt…) servirait sinon un fichier caché.
        location ~ /\.(?!well-known/) {
            deny all;
        }

        location ~* \.(css|js|mjs|woff2?|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|pdf)$ {
            expires 30d;
            add_header Cache-Control "public";
            log_not_found off;
        }

    }
}
