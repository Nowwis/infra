# Local : services applicatifs seulement, branchés sur le socle (docs/CONTRACT.md).
services:
    php:
        profiles: [php]
        build:
            context: ./php
            args:
                PHP_VERSION: ${PHP_VERSION}
                COMPOSER_VERSION: ${COMPOSER_VERSION}
                ENABLE_XDEBUG: ${ENABLE_XDEBUG}
                UID: ${UID}
                GID: ${GID}
        image: ${COMPOSE_PROJECT_NAME}-php:${PHP_VERSION}
        volumes:
            - ${APP_FOLDER}:/var/www
            - ./php/90-extra-config.ini:/usr/local/etc/php/conf.d/90-extra-config.ini
        networks: [project_network, databases, mailer]

    nginx:
        build:
            context: ./nginx
        volumes:
            - ${APP_FOLDER}:/var/www
            - ./nginx/${PROJECT_TYPE}.conf:/etc/templates/nginx.conf
        environment:
            ADMIN_FOLDER_PRESTASHOP: ${ADMIN_FOLDER_PRESTASHOP}
        depends_on:
            php:
                condition: service_started
                required: false
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=traefik"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_DOMAIN}`)"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT}"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
            - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
            - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
        networks: [project_network, traefik]

    nodejs:
        profiles: [assets]
        image: node:22
        user: "${UID}:${GID}"
        working_dir: /var/www
        environment:
            - NODE_ENV=development
        volumes:
            - ${APP_FOLDER}:/var/www
        # Pas de watch résident : il coûte 640 à 865 Mio par stack pour des assets qui changent
        # rarement. Le conteneur installe les dépendances puis reste inactif ; on compile à la
        # demande (make yarn-dev, make yarn-build).
        command: sh -c "if [ -f package.json ]; then yarn install; fi && exec tail -f /dev/null"
        networks: [project_network]

networks:
    project_network:
    databases:
        external: true
    mailer:
        external: true
    traefik:
        external: true
