; Réglages communs, montés par php (et worker) en local comme en prod. Un projet qui a besoin d'autres
; valeurs (envois plus gros…) monte son propre fichier sur /usr/local/etc/php/conf.d/95-project.ini,
; lu après celui-ci (voir README, « Ce qui est propre au projet »).
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 600
max_input_vars = 10000
date.timezone = "Europe/Paris"
; Erreurs dans le journal du conteneur, jamais dans la page.
log_errors = On
display_errors = Off
