; Local seulement (monté par docker-compose.yml, jamais par la prod) : mail() part dans le
; Mailpit du socle (infra_mailer:1025), rien ne sort. Interface : https://mailer.docker.test.
; --read-envelope-from : l'expéditeur de l'enveloppe est l'en-tête From du message.
sendmail_path = "/usr/bin/msmtp -t --read-envelope-from --host=infra_mailer --port=1025 --auth=off --tls=off"
